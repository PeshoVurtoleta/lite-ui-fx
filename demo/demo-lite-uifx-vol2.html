<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@zakkster/lite-ui-fx Vol. 2 — 20 Canvas UI Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --bg: #020206;
            --panel: rgba(10, 10, 18, .94);
            --border: rgba(255, 255, 255, .06);
            --text: #e2e2f0;
            --dim: #9999b8;
            --accent: #a78bfa
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding: 30px 16px 60px
        }

        .top {
            text-align: center;
            margin-bottom: 32px
        }

        .top h1 {
            font-size: clamp(20px, 4vw, 30px);
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #fbbf24, #6ee7b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .top p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #9999b8;
            margin-top: 6px
        }

        .cat-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 36px 0 14px;
            padding-left: 4px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            position: relative;
            transition: border-color .2s
        }

        .card:hover {
            border-color: rgba(255, 255, 255, .1)
        }

        .card-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #9999b8;
            margin-bottom: 10px;
            text-align: center
        }

        .ui-wrap {
            position: relative;
            display: inline-block
        }

        .ui-wrap canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1
        }

        .native {
            position: relative;
            z-index: 2;
            opacity: 0;
            cursor: pointer;
            border: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            padding: 0;
            margin: 0;
            font-family: 'Space Grotesk', sans-serif
        }

        .native::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            cursor: grab
        }

        .native::-moz-range-thumb {
            width: 24px;
            height: 24px;
            cursor: grab;
            border: none;
            background: transparent
        }
    </style>
</head>
<body>
<div class="top">
    <h1>lite-ui-fx — Vol. 2</h1>
    <p>20 Canvas-Rendered UI Recipes • 7 Categories • Zero Dependencies</p>
</div>
<div id="app"></div>

<script>
    // ═══════════════════════════════════════════════════════════
    //  CORE ENGINE (inline for CodePen — in prod: import from packages)
    // ═══════════════════════════════════════════════════════════
    const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const easeOut = t => {
        const f = t - 1;
        return f * f * f + 1
    };
    const easeIn = t => t * t * t;

    class Random {
        constructor(s = 42) {
            this.seed = s;
            this._s = s
        }

        next() {
            let t = this._s += 0x6D2B79F5;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }

        reset(s) {
            if (s !== undefined) this.seed = s;
            this._s = this.seed
        }

        range(a, b) {
            return a + this.next() * (b - a)
        }

        pick(a) {
            return a[Math.floor(this.next() * a.length)]
        }
    }

    // Shared ticker
    const _T = {fns: new Set(), last: 0, running: false};

    function tick(now) {
        const dt = _T.last ? Math.min(now - _T.last, 100) / 1000 : .016;
        _T.last = now;
        for (const fn of _T.fns) fn(dt, now);
        requestAnimationFrame(tick)
    }

    requestAnimationFrame(tick);

    // ── Helpers ──
    function rr(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.arcTo(x + w, y, x + w, y + r, r);
        c.lineTo(x + w, y + h - r);
        c.arcTo(x + w, y + h, x + w - r, y + h, r);
        c.lineTo(x + r, y + h);
        c.arcTo(x, y + h, x, y + h - r, r);
        c.lineTo(x, y + r);
        c.arcTo(x, y, x + r, y, r);
        c.closePath()
    }

    function lbl(c, t, x, y, col = '#9999b8') {
        c.fillStyle = col;
        c.font = "500 9px 'JetBrains Mono',monospace";
        c.textAlign = 'center';
        c.fillText(t, x, y)
    }

    function fr(c, w, h, r) {
        c.strokeStyle = 'rgba(110,231,182,.5)';
        c.lineWidth = 2;
        c.setLineDash([4, 3]);
        rr(c, -2, -2, w + 4, h + 4, r + 2);
        c.stroke();
        c.setLineDash([])
    }

    // ═══════════════════════════════════════════════════════════
    //  CONTROLLER
    // ═══════════════════════════════════════════════════════════
    function mount(container, type, recipeFn, opts = {}) {
        const w = opts.width || (type === 'button' ? 160 : type === 'slider' ? 200 : type === 'checkbox' ? 36 : 64);
        const h = opts.height || (type === 'button' ? 48 : type === 'slider' ? 28 : 36);
        const pad = opts.padding || 40;
        const dpr = devicePixelRatio || 1;

        let el;
        if (type === 'toggle' || type === 'checkbox') {
            el = document.createElement('input');
            el.type = 'checkbox';
            el.setAttribute('role', 'switch');
            el.className = 'native'
        } else if (type === 'slider') {
            el = document.createElement('input');
            el.type = 'range';
            el.min = '0';
            el.max = '100';
            el.value = '50';
            el.className = 'native'
        } else {
            el = document.createElement('button');
            el.type = 'button';
            el.textContent = opts.label || '';
            el.className = 'native'
        }
        el.style.width = w + 'px';
        el.style.height = h + 'px';

        const cvs = document.createElement('canvas');
        const cw = w + pad * 2, ch = h + pad * 2;
        cvs.width = cw * dpr;
        cvs.height = ch * dpr;
        cvs.style.cssText = `position:absolute;top:0;left:0;width:${cw}px;height:${ch}px;transform:translate(-${pad}px,-${pad}px);pointer-events:none;z-index:1`;
        const ctx = cvs.getContext('2d');
        ctx.scale(dpr, dpr);

        const wrap = document.createElement('div');
        wrap.className = 'ui-wrap';
        wrap.style.width = w + 'px';
        wrap.style.height = h + 'px';
        wrap.appendChild(el);
        wrap.appendChild(cvs);
        container.appendChild(wrap);

        const st = {hover: false, active: false, focused: false, toggled: false, val: .5, w, h, padding: pad, dpr};
        const ptr = {x: -999, y: -999, vx: 0, vy: 0};
        const recipe = recipeFn();
        if (recipe.init) recipe.init(ctx, w, h, pad);

        const ac = new AbortController(), sig = ac.signal;
        const up = e => {
            const r = el.getBoundingClientRect();
            const nx = e.clientX - r.left, ny = e.clientY - r.top;
            ptr.vx = nx - ptr.x;
            ptr.vy = ny - ptr.y;
            ptr.x = nx;
            ptr.y = ny
        };
        el.addEventListener('pointermove', up, {signal: sig});
        el.addEventListener('pointerenter', e => {
            st.hover = true;
            up(e);
            if (recipe.onHover) recipe.onHover(st, ptr)
        }, {signal: sig});
        el.addEventListener('pointerleave', () => {
            st.hover = false;
            if (recipe.onLeave) recipe.onLeave(st, ptr)
        }, {signal: sig});
        el.addEventListener('pointerdown', e => {
            st.active = true;
            up(e);
            if (recipe.onClick) recipe.onClick(ptr.x, ptr.y, st)
        }, {signal: sig});
        el.addEventListener('pointerup', () => {
            st.active = false
        }, {signal: sig});
        el.addEventListener('focus', () => {
            st.focused = true
        }, {signal: sig});
        el.addEventListener('blur', () => {
            st.focused = false
        }, {signal: sig});
        if (type === 'toggle' || type === 'checkbox') el.addEventListener('change', () => {
            st.toggled = el.checked;
            if (recipe.onToggle) recipe.onToggle(st.toggled, st)
        }, {signal: sig});
        if (type === 'slider') el.addEventListener('input', () => {
            st.val = el.value / 100;
            if (recipe.onDrag) recipe.onDrag(st.val, ptr.vx, st)
        }, {signal: sig});

        const tickFn = (dt, now) => {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cw, ch);
            ctx.save();
            ctx.translate(pad, pad);
            recipe.tick(ctx, dt, now, st, ptr);
            ctx.restore()
        };
        _T.fns.add(tickFn);

        return {
            el, destroy() {
                ac.abort();
                _T.fns.delete(tickFn);
                if (recipe.destroy) recipe.destroy();
                wrap.remove()
            }
        };
    }

    // ═══════════════════════════════════════════════════════════
    //  20 RECIPES (compact inline versions)
    // ═══════════════════════════════════════════════════════════

    // ── TOGGLES ──
    const PendulumToggle = () => {
        let ang = -.4, vel = 0;
        return {
            onToggle() {
                vel += 8
            }, tick(c, dt, now, s) {
                const tgt = s.toggled ? .4 : -.4;
                vel += (tgt - ang) * 12 * dt;
                vel *= (1 - 3.5 * dt);
                ang += vel * dt;
                c.fillStyle = s.toggled ? 'rgba(110,231,182,.2)' : 'rgba(255,255,255,.06)';
                rr(c, 0, 0, s.w, s.h, s.h / 2);
                c.fill();
                const cx = s.w / 2, len = s.h / 2 + 14, bx = cx + Math.sin(ang) * len, by = -10 + Math.cos(ang) * len;
                c.strokeStyle = s.toggled ? 'rgba(110,231,182,.3)' : 'rgba(255,255,255,.08)';
                c.lineWidth = 2;
                c.beginPath();
                c.moveTo(cx, -10);
                c.lineTo(bx, by);
                c.stroke();
                c.fillStyle = s.toggled ? '#6ee7b6' : '#9999b8';
                c.beginPath();
                c.arc(bx, by, 12, 0, Math.PI * 2);
                c.fill();
                lbl(c, s.toggled ? 'ON' : 'OFF', s.w / 2, s.h + 14, s.toggled ? '#6ee7b6' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    const CircuitToggle = () => {
        const rng = new Random(42);
        let sps = [], kx = 18, ft = 0;
        return {
            onToggle(ch) {
                if (ch) for (let i = 0; i < 8; i++) sps.push({t: rng.range(0, 1), life: 1, spd: rng.range(.3, .8)})
            }, tick(c, dt, now, s) {
                kx = lerp(kx, s.toggled ? s.w - 18 : 18, dt * 12);
                ft = (ft + dt * 2) % 1;
                c.fillStyle = 'rgba(255,255,255,.04)';
                rr(c, 0, 0, s.w, s.h, s.h / 2);
                c.fill();
                c.strokeStyle = s.toggled ? '#22d3ee' : 'rgba(255,255,255,.06)';
                c.lineWidth = 2;
                c.setLineDash([4, 4]);
                c.lineDashOffset = -ft * 16;
                c.beginPath();
                c.moveTo(8, s.h / 2);
                c.lineTo(s.w - 8, s.h / 2);
                c.stroke();
                c.setLineDash([]);
                c.lineDashOffset = 0;
                if (s.toggled) {
                    c.fillStyle = '#22d3ee';
                    for (let i = sps.length - 1; i >= 0; i--) {
                        const p = sps[i];
                        p.t += p.spd * dt;
                        p.life -= dt * .5;
                        if (p.life <= 0 || p.t > 1) {
                            sps.splice(i, 1);
                            continue
                        }
                        c.globalAlpha = p.life;
                        c.beginPath();
                        c.arc(8 + p.t * (s.w - 16), s.h / 2, 2, 0, Math.PI * 2);
                        c.fill()
                    }
                    c.globalAlpha = 1;
                    if (sps.length < 12) sps.push({t: 0, life: 1, spd: rng.range(.3, .8)})
                }
                c.fillStyle = s.toggled ? '#22d3ee' : '#9999b8';
                c.beginPath();
                c.arc(kx, s.h / 2, 12, 0, Math.PI * 2);
                c.fill();
                lbl(c, s.toggled ? 'ON' : 'OFF', s.w / 2, s.h + 14, s.toggled ? '#22d3ee' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    const LightningToggle = () => {
        const rng = new Random(42);
        let kx = 18;

        function bolt(c, x1, y1, x2, y2, d) {
            if (d <= 0) {
                c.lineTo(x2, y2);
                return
            }
            const mx = (x1 + x2) / 2 + (rng.next() - .5) * 12 * d, my = (y1 + y2) / 2 + (rng.next() - .5) * 8 * d;
            bolt(c, x1, y1, mx, my, d - 1);
            bolt(c, mx, my, x2, y2, d - 1)
        }

        return {
            tick(c, dt, now, s) {
                kx = lerp(kx, s.toggled ? s.w - 18 : 18, dt * 14);
                c.fillStyle = s.toggled ? 'rgba(251,191,36,.15)' : 'rgba(255,255,255,.04)';
                rr(c, 0, 0, s.w, s.h, s.h / 2);
                c.fill();
                if (s.toggled && ((now / 80 | 0) % 3 !== 0)) {
                    rng.reset((now / 80 | 0) * 7 + 1);
                    c.strokeStyle = 'rgba(251,191,36,.7)';
                    c.lineWidth = 1.5;
                    c.beginPath();
                    c.moveTo(8, s.h / 2);
                    bolt(c, 8, s.h / 2, s.w - 8, s.h / 2, 3);
                    c.stroke()
                }
                c.fillStyle = s.toggled ? '#fbbf24' : '#9999b8';
                c.beginPath();
                c.arc(kx, s.h / 2, 12, 0, Math.PI * 2);
                c.fill();
                lbl(c, s.toggled ? 'ON' : 'OFF', s.w / 2, s.h + 14, s.toggled ? '#fbbf24' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    const DNAToggle = () => {
        let kx = 18, ph = 0;
        return {
            tick(c, dt, now, s) {
                kx = lerp(kx, s.toggled ? s.w - 18 : 18, dt * 10);
                ph += dt * (s.toggled ? 4 : 1.5);
                c.fillStyle = 'rgba(255,255,255,.04)';
                rr(c, 0, 0, s.w, s.h, s.h / 2);
                c.fill();
                const cy = s.h / 2;
                for (let i = 0; i < 20; i++) {
                    const t = i / 20, x = 6 + t * (s.w - 12), y1 = cy + Math.sin(ph + t * Math.PI * 3) * 8,
                        y2 = cy - Math.sin(ph + t * Math.PI * 3) * 8;
                    c.fillStyle = s.toggled ? `rgba(167,139,250,${.3 + Math.sin(ph + t * 6) * .2})` : 'rgba(255,255,255,.08)';
                    c.beginPath();
                    c.arc(x, y1, 2, 0, Math.PI * 2);
                    c.fill();
                    c.fillStyle = s.toggled ? `rgba(244,114,182,${.3 + Math.cos(ph + t * 6) * .2})` : 'rgba(255,255,255,.06)';
                    c.beginPath();
                    c.arc(x, y2, 2, 0, Math.PI * 2);
                    c.fill();
                    if (i % 3 === 0) {
                        c.strokeStyle = 'rgba(255,255,255,.04)';
                        c.lineWidth = .5;
                        c.beginPath();
                        c.moveTo(x, y1);
                        c.lineTo(x, y2);
                        c.stroke()
                    }
                }
                c.fillStyle = s.toggled ? '#c084fc' : '#9999b8';
                c.beginPath();
                c.arc(kx, cy, 12, 0, Math.PI * 2);
                c.fill();
                lbl(c, s.toggled ? 'ON' : 'OFF', s.w / 2, s.h + 14, s.toggled ? '#c084fc' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    // ── BUTTONS ──
    const HeartbeatButton = () => {
        const rng = new Random(42);
        let sc = 1, ps = [], bp = 0;
        return {
            onClick(x, y) {
                sc = 1.3;
                for (let i = 0; i < 12; i++) {
                    const a = rng.range(0, Math.PI * 2), v = rng.range(40, 120);
                    ps.push({x: x || 80, y: y || 24, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1})
                }
            }, tick(c, dt, now, s) {
                sc = lerp(sc, 1, dt * 8);
                bp += dt * 5;
                const pu = 1 + Math.sin(bp) * .03;
                c.fillStyle = s.active ? 'rgba(220,20,60,.2)' : 'rgba(220,20,60,.08)';
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                c.save();
                c.translate(s.w / 2, s.h / 2);
                c.scale(sc * pu, sc * pu);
                c.fillStyle = '#DC143C';
                c.beginPath();
                c.moveTo(0, 4);
                c.bezierCurveTo(-10, -6, -20, -2, -20, 4);
                c.bezierCurveTo(-20, 14, 0, 20, 0, 20);
                c.bezierCurveTo(0, 20, 20, 14, 20, 4);
                c.bezierCurveTo(20, -2, 10, -6, 0, 4);
                c.fill();
                c.restore();
                c.globalCompositeOperation = 'screen';
                for (let i = ps.length - 1; i >= 0; i--) {
                    const p = ps[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= 2 * dt;
                    if (p.life <= 0) {
                        ps.splice(i, 1);
                        continue
                    }
                    c.fillStyle = `rgba(255,60,100,${p.life})`;
                    c.beginPath();
                    c.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    c.fill()
                }
                c.globalCompositeOperation = 'source-over';
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    const BreathingButton = () => {
        let ph = 0;
        return {
            tick(c, dt, now, s) {
                ph += dt * 1.5;
                const b = (Math.sin(ph) + 1) / 2, r = 4 + b * 6;
                c.shadowBlur = 10 + b * 15;
                c.shadowColor = `rgba(110,231,182,${.2 + b * .3})`;
                c.fillStyle = `rgba(110,231,182,${.05 + b * .08})`;
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                c.shadowBlur = 0;
                c.strokeStyle = `rgba(110,231,182,${.1 + b * .2})`;
                c.lineWidth = 1;
                c.beginPath();
                c.arc(s.w / 2, s.h / 2, s.w / 2 + r, 0, Math.PI * 2);
                c.stroke();
                c.fillStyle = '#6ee7b6';
                c.font = "600 12px 'Space Grotesk',sans-serif";
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('BREATHE', s.w / 2, s.h / 2);
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    const InkSplashButton = () => {
        const rng = new Random(42);
        let sps = [], ps = 1;
        return {
            onClick(x, y) {
                ps = .88;
                const cx = x || 80, cy = y || 24;
                for (let i = 0; i < 20; i++) {
                    const a = rng.range(0, Math.PI * 2), d = rng.range(5, 35);
                    sps.push({x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, r: rng.range(2, 8), life: 1})
                }
            }, tick(c, dt, now, s) {
                ps = lerp(ps, 1, dt * 8);
                c.save();
                c.translate(s.w / 2, s.h / 2);
                c.scale(ps, ps);
                c.translate(-s.w / 2, -s.h / 2);
                c.fillStyle = 'rgba(255,255,255,.06)';
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                c.fillStyle = '#e2e2f0';
                c.font = "600 13px 'Space Grotesk',sans-serif";
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('INK', s.w / 2, s.h / 2);
                c.restore();
                for (let i = sps.length - 1; i >= 0; i--) {
                    const p = sps[i];
                    p.life -= 1.5 * dt;
                    if (p.life <= 0) {
                        sps.splice(i, 1);
                        continue
                    }
                    c.fillStyle = `rgba(30,30,50,${p.life * .7})`;
                    c.beginPath();
                    c.arc(p.x, p.y, p.r * easeOut(1 - p.life), 0, Math.PI * 2);
                    c.fill()
                }
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    const PixelDissolveButton = () => {
        const rng = new Random(42);
        const N = 16 * 5, ox = new Float32Array(N), oy = new Float32Array(N), px = new Float32Array(N),
            py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
        let dT = 0;
        return {
            init(ctx, w, h) {
                const pw = w / 16, ph = h / 5;
                for (let i = 0; i < N; i++) {
                    ox[i] = (i % 16) * pw + pw / 2;
                    oy[i] = ((i / 16) | 0) * ph + ph / 2;
                    px[i] = ox[i];
                    py[i] = oy[i]
                }
            }, onHover() {
                rng.reset(42);
                for (let i = 0; i < N; i++) {
                    vx[i] = rng.range(-30, 30);
                    vy[i] = rng.range(-30, 30)
                }
            }, tick(c, dt, now, s) {
                dT = lerp(dT, s.hover ? 1 : 0, dt * 6);
                c.fillStyle = s.hover ? 'rgba(167,139,250,.4)' : 'rgba(255,255,255,.12)';
                const pw = s.w / 16, ph = s.h / 5;
                for (let i = 0; i < N; i++) {
                    px[i] = lerp(px[i], ox[i] + vx[i] * dT, dt * 10);
                    py[i] = lerp(py[i], oy[i] + vy[i] * dT, dt * 10);
                    c.globalAlpha = 1 - dT * .3;
                    c.fillRect(px[i] - pw / 2 + .5, py[i] - ph / 2 + .5, pw - 1, ph - 1)
                }
                c.globalAlpha = 1;
                if (dT < .3) {
                    c.fillStyle = '#e2e2f0';
                    c.font = "600 12px 'Space Grotesk',sans-serif";
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.globalAlpha = 1 - dT / .3;
                    c.fillText('DISSOLVE', s.w / 2, s.h / 2);
                    c.globalAlpha = 1
                }
                if (s.focused) fr(c, s.w, s.h, 0)
            }
        }
    };

    const FireworkButton = () => {
        const rng = new Random(42);
        let rk = [], sp = [], ps = 1;
        const cols = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bcb'];
        return {
            onClick(x, y, s) {
                ps = .88;
                rk.push({x: x || s.w / 2, y: s.h, vy: -rng.range(150, 250), life: 1, c: rng.pick(cols)})
            }, tick(c, dt, now, s) {
                ps = lerp(ps, 1, dt * 10);
                c.save();
                c.translate(s.w / 2, s.h / 2);
                c.scale(ps, ps);
                c.translate(-s.w / 2, -s.h / 2);
                c.fillStyle = 'rgba(255,255,255,.06)';
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                c.fillStyle = '#fbbf24';
                c.font = "600 13px 'Space Grotesk',sans-serif";
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('🎆 FIRE', s.w / 2, s.h / 2);
                c.restore();
                for (let i = rk.length - 1; i >= 0; i--) {
                    const r = rk[i];
                    r.y += r.vy * dt;
                    r.vy += 80 * dt;
                    r.life -= dt;
                    c.fillStyle = r.c;
                    c.beginPath();
                    c.arc(r.x, r.y, 3, 0, Math.PI * 2);
                    c.fill();
                    if (r.life <= 0 || r.y < -20) {
                        for (let j = 0; j < 20; j++) {
                            const a = rng.range(0, Math.PI * 2), v = rng.range(30, 100);
                            sp.push({x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: r.c})
                        }
                        rk.splice(i, 1)
                    }
                }
                c.globalCompositeOperation = 'screen';
                for (let i = sp.length - 1; i >= 0; i--) {
                    const p = sp[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 60 * dt;
                    p.life -= 1.5 * dt;
                    if (p.life <= 0) {
                        sp.splice(i, 1);
                        continue
                    }
                    c.fillStyle = p.c;
                    c.globalAlpha = p.life;
                    c.beginPath();
                    c.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                    c.fill()
                }
                c.globalCompositeOperation = 'source-over';
                c.globalAlpha = 1;
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    // ── SLIDERS ──
    const AuroraSlider = () => {
        let t = 0;
        const cols = ['#6ee7b6', '#38bdf8', '#a78bfa', '#c084fc'];
        return {
            tick(c, dt, now, s) {
                t += dt;
                c.fillStyle = 'rgba(255,255,255,.06)';
                rr(c, 0, 12, s.w, 4, 2);
                c.fill();
                const tx = s.val * s.w;
                if (tx > 2) {
                    const g = c.createLinearGradient(0, 0, tx, 0);
                    for (let i = 0; i < 4; i++) g.addColorStop(clamp(i / 3 + Math.sin(t + i) * .15, 0, 1), cols[i]);
                    c.fillStyle = g;
                    c.shadowBlur = 8;
                    c.shadowColor = '#6ee7b6';
                    rr(c, 0, 12, tx, 4, 2);
                    c.fill();
                    c.shadowBlur = 0
                }
                c.fillStyle = '#fff';
                c.beginPath();
                c.arc(tx, 14, 8, 0, Math.PI * 2);
                c.fill();
                lbl(c, Math.round(s.val * 100) + '%', s.w / 2, s.h + 10);
                if (s.focused) fr(c, s.w, s.h, 4)
            }
        }
    };

    const WaveSlider = () => {
        const rng = new Random(42);
        const bars = new Float32Array(40);
        for (let i = 0; i < 40; i++) bars[i] = rng.range(.2, 1);
        return {
            tick(c, dt, now, s) {
                c.fillStyle = 'rgba(255,255,255,.04)';
                rr(c, 0, 4, s.w, 20, 3);
                c.fill();
                const tx = s.val * s.w, bw = s.w / 40;
                for (let i = 0; i < 40; i++) {
                    const bx = i * bw, act = bx < tx, h = bars[i] * 16 * (.5 + Math.sin(now / 300 + i * .3) * .3);
                    c.fillStyle = act ? '#f472b6' : 'rgba(255,255,255,.06)';
                    c.fillRect(bx + 1, 14 - h / 2, bw - 2, h)
                }
                c.fillStyle = '#f472b6';
                c.beginPath();
                c.arc(tx, 14, 8, 0, Math.PI * 2);
                c.fill();
                lbl(c, Math.round(s.val * 100) + '%', s.w / 2, s.h + 10);
                if (s.focused) fr(c, s.w, s.h, 4)
            }
        }
    };

    const ElasticSlider = () => {
        let lx = 0;
        return {
            tick(c, dt, now, s) {
                const tx = s.val * s.w;
                lx = lerp(lx, tx, dt * 4);
                const st = (tx - lx) * .3;
                c.fillStyle = 'rgba(255,255,255,.06)';
                rr(c, 0, 12, s.w, 4, 2);
                c.fill();
                c.strokeStyle = '#fb923c';
                c.lineWidth = 3;
                c.beginPath();
                c.moveTo(0, 14);
                c.quadraticCurveTo(lx + st, 14 + st * .2, tx, 14);
                c.stroke();
                c.fillStyle = '#fb923c';
                c.beginPath();
                c.arc(tx, 14, 9, 0, Math.PI * 2);
                c.fill();
                lbl(c, Math.round(s.val * 100) + '%', s.w / 2, s.h + 10);
                if (s.focused) fr(c, s.w, s.h, 4)
            }
        }
    };

    const GravitySlider = () => ({
        tick(c, dt, now, s) {
            const tx = s.val * s.w, sag = 8;
            c.strokeStyle = 'rgba(255,255,255,.1)';
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(0, 14);
            c.quadraticCurveTo(tx, 14 + sag, s.w, 14);
            c.stroke();
            c.strokeStyle = '#c084fc';
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(0, 14);
            c.quadraticCurveTo(tx / 2, 14 + sag * (tx / s.w), tx, 14 + sag * Math.sin(Math.PI * s.val));
            c.stroke();
            c.fillStyle = '#c084fc';
            c.beginPath();
            c.arc(tx, 14 + sag * Math.sin(Math.PI * s.val), 10, 0, Math.PI * 2);
            c.fill();
            lbl(c, Math.round(s.val * 100) + '%', s.w / 2, s.h + 14);
            if (s.focused) fr(c, s.w, s.h + 8, 4)
        }
    });

    // ── LOADERS ──
    const OrbitLoader = () => {
        let ph = 0;
        const pl = [{r: 14, sp: 2, sz: 3, c: '#38bdf8'}, {r: 22, sp: 1.2, sz: 2.5, c: '#6ee7b6'}, {
            r: 30,
            sp: .7,
            sz: 2,
            c: '#fbbf24'
        }];
        return {
            tick(c, dt, now, s) {
                if (s.toggled) ph += dt;
                const cx = s.w / 2, cy = s.h / 2;
                pl.forEach(p => {
                    c.strokeStyle = 'rgba(255,255,255,.04)';
                    c.lineWidth = .5;
                    c.beginPath();
                    c.arc(cx, cy, p.r, 0, Math.PI * 2);
                    c.stroke();
                    const a = ph * p.sp;
                    c.fillStyle = p.c;
                    c.beginPath();
                    c.arc(cx + Math.cos(a) * p.r, cy + Math.sin(a) * p.r, p.sz, 0, Math.PI * 2);
                    c.fill()
                });
                c.fillStyle = '#fbbf24';
                c.beginPath();
                c.arc(cx, cy, 5, 0, Math.PI * 2);
                c.fill();
                lbl(c, s.toggled ? 'LOADING...' : 'IDLE', s.w / 2, s.h + 14, s.toggled ? '#fbbf24' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    const HelixLoader = () => {
        let ph = 0;
        return {
            tick(c, dt, now, s) {
                if (s.toggled) ph += dt * 4;
                const cx = s.w / 2, cy = s.h / 2;
                for (let i = 0; i < 12; i++) {
                    const t = i / 12, a = ph + t * Math.PI * 2, x1 = cx + Math.cos(a) * 16, y1 = cy + Math.sin(a) * 6,
                        x2 = cx - Math.cos(a) * 16, y2 = cy - Math.sin(a) * 6, d = (Math.sin(a) + 1) / 2;
                    c.fillStyle = `rgba(167,139,250,${.2 + d * .6})`;
                    c.beginPath();
                    c.arc(x1, y1, 2 + d, 0, Math.PI * 2);
                    c.fill();
                    c.fillStyle = `rgba(244,114,182,${.2 + (1 - d) * .6})`;
                    c.beginPath();
                    c.arc(x2, y2, 2 + (1 - d), 0, Math.PI * 2);
                    c.fill();
                    c.strokeStyle = `rgba(255,255,255,${.03 + d * .04})`;
                    c.lineWidth = .5;
                    c.beginPath();
                    c.moveTo(x1, y1);
                    c.lineTo(x2, y2);
                    c.stroke()
                }
                lbl(c, s.toggled ? 'PROCESSING' : 'IDLE', s.w / 2, s.h + 14, s.toggled ? '#c084fc' : '#8888aa');
                if (s.focused) fr(c, s.w, s.h, s.h / 2)
            }
        }
    };

    // ── CHECKBOXES ──
    const RippleCheck = () => {
        let rps = [], ct = 0;
        return {
            onToggle(ch) {
                if (ch) rps.push({r: 0, life: 1})
            }, tick(c, dt, now, s) {
                ct = lerp(ct, s.toggled ? 1 : 0, dt * 10);
                const sz = Math.min(s.w, s.h), cx = sz / 2;
                c.fillStyle = s.toggled ? '#6ee7b6' : 'rgba(255,255,255,.06)';
                rr(c, 0, 0, sz, sz, 6);
                c.fill();
                for (let i = rps.length - 1; i >= 0; i--) {
                    const r = rps[i];
                    r.r += 50 * dt;
                    r.life -= 2 * dt;
                    if (r.life <= 0) {
                        rps.splice(i, 1);
                        continue
                    }
                    c.strokeStyle = `rgba(110,231,182,${r.life})`;
                    c.lineWidth = 2;
                    c.beginPath();
                    c.arc(cx, cx, r.r, 0, Math.PI * 2);
                    c.stroke()
                }
                if (ct > .01) {
                    c.strokeStyle = '#000';
                    c.lineWidth = 3;
                    c.lineCap = 'round';
                    c.beginPath();
                    const p1 = clamp(ct * 2, 0, 1), p2 = clamp(ct * 2 - 1, 0, 1);
                    c.moveTo(cx - 7, cx);
                    c.lineTo(cx - 7 + 7 * p1, cx + 7 * p1);
                    if (p2 > 0) c.lineTo(cx + 14 * p2, cx + 7 - 14 * p2);
                    c.stroke();
                    c.lineCap = 'butt'
                }
                lbl(c, s.toggled ? '✓' : '○', sz / 2, sz + 12, s.toggled ? '#6ee7b6' : '#8888aa');
                if (s.focused) fr(c, sz, sz, 6)
            }
        }
    };

    const MorphCheck = () => {
        let t = 0;
        return {
            tick(c, dt, now, s) {
                t = lerp(t, s.toggled ? 1 : 0, dt * 8);
                const sz = Math.min(s.w, s.h), cx = sz / 2;
                c.fillStyle = t > .5 ? `rgba(56,189,248,${lerp(0, .2, t)})` : 'rgba(255,255,255,.06)';
                rr(c, 0, 0, sz, sz, 6);
                c.fill();
                c.strokeStyle = t > .5 ? '#38bdf8' : '#9999b8';
                c.lineWidth = 2.5;
                c.lineCap = 'round';
                c.beginPath();
                c.moveTo(lerp(cx - 8, cx - 7, t), lerp(cx - 8, cx, t));
                c.lineTo(lerp(cx + 8, cx - 2, t), lerp(cx + 8, cx + 7, t));
                c.stroke();
                c.beginPath();
                c.moveTo(lerp(cx - 8, cx - 2, t), lerp(cx + 8, cx + 7, t));
                c.lineTo(lerp(cx + 8, cx + 8, t), lerp(cx - 8, cx - 6, t));
                c.stroke();
                c.lineCap = 'butt';
                lbl(c, s.toggled ? '✓' : '✕', sz / 2, sz + 12, s.toggled ? '#38bdf8' : '#8888aa');
                if (s.focused) fr(c, sz, sz, 6)
            }
        }
    };

    // ── COUNTERS ──
    const FlameCounter = () => {
        const rng = new Random(42);
        let emb = [];
        return {
            tick(c, dt, now, s) {
                const val = Math.round(s.val * 999);
                if (s.val > .1 && emb.length < 60) emb.push({
                    x: rng.range(20, s.w - 20),
                    y: s.h - 5,
                    vy: -rng.range(20, 60),
                    life: 1,
                    sz: rng.range(1, 3)
                });
                c.fillStyle = 'rgba(255,255,255,.03)';
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                c.globalCompositeOperation = 'screen';
                for (let i = emb.length - 1; i >= 0; i--) {
                    const e = emb[i];
                    e.y += e.vy * dt;
                    e.life -= dt * .8;
                    if (e.life <= 0) {
                        emb.splice(i, 1);
                        continue
                    }
                    c.fillStyle = `rgba(${200 + s.val * 55},${60 + s.val * 80},20,${e.life})`;
                    c.beginPath();
                    c.arc(e.x, e.y, e.sz, 0, Math.PI * 2);
                    c.fill()
                }
                c.globalCompositeOperation = 'source-over';
                c.fillStyle = s.val > .7 ? '#ff6b6b' : s.val > .3 ? '#fbbf24' : '#9999b8';
                c.font = "700 28px 'JetBrains Mono',monospace";
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(String(val), s.w / 2, s.h / 2);
                lbl(c, 'HEAT', s.w / 2, s.h + 12);
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    const GlitchCounter = () => {
        const rng = new Random(42);
        return {
            tick(c, dt, now, s) {
                const val = Math.round(s.val * 999), int = s.val;
                c.fillStyle = 'rgba(255,255,255,.03)';
                rr(c, 0, 0, s.w, s.h, 10);
                c.fill();
                if (int > .2) {
                    c.fillStyle = `rgba(255,255,255,${int * .03})`;
                    for (let y = 0; y < s.h; y += 3) c.fillRect(0, y, s.w, 1)
                }
                const jx = int > .5 ? (rng.next() - .5) * int * 6 : 0, jy = int > .5 ? (rng.next() - .5) * int * 4 : 0;
                if (int > .3 && rng.next() > .6) {
                    c.globalCompositeOperation = 'screen';
                    c.fillStyle = `rgba(255,0,85,${int * .4})`;
                    c.font = "700 28px 'JetBrains Mono',monospace";
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillText(String(val), s.w / 2 + jx - 2, s.h / 2 + jy);
                    c.fillStyle = `rgba(0,255,204,${int * .4})`;
                    c.fillText(String(val), s.w / 2 + jx + 2, s.h / 2 + jy);
                    c.globalCompositeOperation = 'source-over'
                }
                c.fillStyle = '#e2e2f0';
                c.font = "700 28px 'JetBrains Mono',monospace";
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(String(val), s.w / 2 + jx, s.h / 2 + jy);
                lbl(c, 'SIGNAL', s.w / 2, s.h + 12);
                if (s.focused) fr(c, s.w, s.h, 10)
            }
        }
    };

    // ── RATING ──
    const BubbleRating = () => {
        const rng = new Random(42);
        let pops = [], sizes = new Float32Array(5);
        return {
            onDrag(val) {
                const r = Math.round(val * 5), g = 200 / 5, cx = g * (r - 1) + g / 2;
                for (let j = 0; j < 5; j++) {
                    const a = rng.range(0, Math.PI * 2), v = rng.range(20, 50);
                    pops.push({x: cx, y: 14, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1})
                }
            }, tick(c, dt, now, s) {
                const rating = Math.round(s.val * 5), gap = s.w / 5;
                for (let i = 0; i < 5; i++) {
                    const act = i < rating, tgt = act ? 12 : 6;
                    sizes[i] = lerp(sizes[i] || 6, tgt, dt * 8);
                    const cx = gap * i + gap / 2, cy = s.h / 2;
                    c.fillStyle = act ? `rgba(56,189,248,${.3 + sizes[i] / 20})` : 'rgba(255,255,255,.05)';
                    c.beginPath();
                    c.arc(cx, cy, sizes[i], 0, Math.PI * 2);
                    c.fill();
                    c.strokeStyle = act ? '#38bdf8' : 'rgba(255,255,255,.08)';
                    c.lineWidth = 1;
                    c.beginPath();
                    c.arc(cx, cy, sizes[i], 0, Math.PI * 2);
                    c.stroke();
                    if (act) {
                        c.fillStyle = 'rgba(255,255,255,.15)';
                        c.beginPath();
                        c.arc(cx - 3, cy - 3, 3, 0, Math.PI * 2);
                        c.fill()
                    }
                }
                for (let i = pops.length - 1; i >= 0; i--) {
                    const p = pops[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= 3 * dt;
                    if (p.life <= 0) {
                        pops.splice(i, 1);
                        continue
                    }
                    c.fillStyle = `rgba(56,189,248,${p.life})`;
                    c.beginPath();
                    c.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                    c.fill()
                }
                lbl(c, `${rating} / 5`, s.w / 2, s.h + 12, rating >= 4 ? '#38bdf8' : '#9999b8');
                if (s.focused) fr(c, s.w, s.h, 4)
            }
        }
    };

    // ═══════════════════════════════════════════════════════════
    //  MOUNT ALL
    // ═══════════════════════════════════════════════════════════
    const app = document.getElementById('app');

    const CATEGORIES = [
        {
            title: 'Toggles', items: [
                {name: '⚡ Pendulum', type: 'toggle', recipe: PendulumToggle},
                {name: '🔌 Circuit', type: 'toggle', recipe: CircuitToggle},
                {name: '⛈ Lightning', type: 'toggle', recipe: LightningToggle},
                {name: '🧬 DNA Helix', type: 'toggle', recipe: DNAToggle},
            ]
        },
        {
            title: 'Buttons', items: [
                {name: '❤️ Heartbeat', type: 'button', recipe: HeartbeatButton, w: 160, h: 48},
                {name: '🫁 Breathing', type: 'button', recipe: BreathingButton, w: 160, h: 48},
                {name: '🖊 Ink Splash', type: 'button', recipe: InkSplashButton, w: 160, h: 48},
                {name: '🧩 Pixel Dissolve', type: 'button', recipe: PixelDissolveButton, w: 160, h: 48},
                {name: '🎆 Firework', type: 'button', recipe: FireworkButton, w: 160, h: 48},
            ]
        },
        {
            title: 'Sliders', items: [
                {name: '🌌 Aurora', type: 'slider', recipe: AuroraSlider},
                {name: '🎵 Waveform', type: 'slider', recipe: WaveSlider},
                {name: '🪢 Elastic Band', type: 'slider', recipe: ElasticSlider},
                {name: '⚖️ Gravity Sag', type: 'slider', recipe: GravitySlider},
            ]
        },
        {
            title: 'Loaders (toggle to start)', items: [
                {name: '🪐 Orbit', type: 'toggle', recipe: OrbitLoader},
                {name: '🧬 Helix', type: 'toggle', recipe: HelixLoader},
            ]
        },
        {
            title: 'Checkboxes', items: [
                {name: '💧 Ripple', type: 'checkbox', recipe: RippleCheck, w: 36, h: 36},
                {name: '✕→✓ Morph', type: 'checkbox', recipe: MorphCheck, w: 36, h: 36},
            ]
        },
        {
            title: 'Counters (drag slider to control)', items: [
                {name: '🔥 Flame', type: 'slider', recipe: FlameCounter, w: 120, h: 60},
                {name: '📺 Glitch', type: 'slider', recipe: GlitchCounter, w: 120, h: 60},
            ]
        },
        {
            title: 'Rating', items: [
                {name: '🫧 Bubbles', type: 'slider', recipe: BubbleRating},
            ]
        },
    ];

    CATEGORIES.forEach(cat => {
        const title = document.createElement('div');
        title.className = 'cat-title';
        title.textContent = cat.title;
        app.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'grid';
        app.appendChild(grid);
        cat.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="card-label">${item.name}</div>`;
            mount(card, item.type, item.recipe, {width: item.w, height: item.h, label: item.name});
            grid.appendChild(card);
        });
    });
</script>
</body>
</html>
